name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - Voir les fichiers
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          # Cherche n'importe quel fichier .zip et le décompresse
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip "$ZIP_FILE"
          fi
          ls -la

      - name: Build APK
        run: |
          # Cherche le dossier qui contient le fichier gradlew
          PROJECT_DIR=$(find . -name "gradlew" -maxdepth 3 -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR: Impossible de trouver le fichier gradlew. Le projet est peut-être incomplet."
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # Cherche l'APK n'importe où dans le dossier
          path: "**/app/build/outputs/apk/debug/*.apk"
