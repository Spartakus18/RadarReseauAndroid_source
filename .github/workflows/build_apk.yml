name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip "$ZIP_FILE"
          fi

      - name: Fix JVM Target Compatibility (Final)
        run: |
          cd RadarReseauAndroid
          
          # On affiche le contenu AVANT modification pour comprendre
          echo "=== AVANT MODIFICATION ==="
          cat app/build.gradle.kts || echo "Fichier app/build.gradle.kts non trouvé"
          
          # On utilise perl pour remplacer TOUTES les occurrences de 1.8 par 17
          find . -name "build.gradle.kts" -exec perl -pi -e 's/VERSION_1_8/VERSION_17/g' {} +
          find . -name "build.gradle.kts" -exec perl -pi -e 's/"1\.8"/"17"/g' {} +
          find . -name "build.gradle.kts" -exec perl -pi -e 's/jvmTarget\s*=\s*"1\.8"/jvmTarget = "17"/g' {} +
          
          echo "=== APRÈS MODIFICATION ==="
          cat app/build.gradle.kts || echo "Fichier app/build.gradle.kts non trouvé"

      - name: Build APK
        run: |
          cd RadarReseauAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
