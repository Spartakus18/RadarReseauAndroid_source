name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip "$ZIP_FILE"
          fi

      - name: Fix JVM Target Compatibility
        run: |
          # Trouve tous les fichiers build.gradle.kts et force Java 17 partout
          find . -name "build.gradle.kts" -maxdepth 4 -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
          find . -name "build.gradle.kts" -maxdepth 4 -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
          find . -name "build.gradle.kts" -maxdepth 4 -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
          echo "Configuration JVM mise à jour vers Java 17."

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -maxdepth 3 -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 3 -exec dirname {} \; | head -n 1)
          fi
          
          echo "Dossier du projet trouvé : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
