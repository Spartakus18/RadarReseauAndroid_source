name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip "$ZIP_FILE"
          fi

      - name: Fix JVM Target Compatibility (Aggressive)
        run: |
          # On entre dans le dossier du projet
          cd RadarReseauAndroid
          
          # On remplace TOUTES les occurrences de 1.8 par 17 dans les fichiers Gradle
          find . -name "build.gradle.kts" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/"1.8"/"17"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/1.8/17/g' {} +
          
          # On affiche le contenu du fichier app/build.gradle.kts pour vérifier
          echo "=== CONTENU DE app/build.gradle.kts ==="
          cat app/build.gradle.kts || echo "Fichier non trouvé"

      - name: Build APK
        run: |
          cd RadarReseauAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
