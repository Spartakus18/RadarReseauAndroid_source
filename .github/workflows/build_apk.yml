name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - Voir les fichiers
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip "$ZIP_FILE"
          fi
          ls -la

      - name: Build APK
        run: |
          # Cherche le dossier contenant le fichier settings.gradle.kts ou build.gradle.kts
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -maxdepth 3 -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 3 -exec dirname {} \; | head -n 1)
          fi
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR: Impossible de trouver le dossier du projet (settings.gradle.kts ou build.gradle.kts manquant)."
            exit 1
          fi
          
          echo "Dossier du projet trouvé : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # On utilise la commande 'gradle' globale car 'gradlew' est manquant
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
